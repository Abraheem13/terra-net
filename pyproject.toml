[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terranet"
version = "1.0.0"
description = "Cross-city path-loss transfer for digital-twin network planning: ray-traced corpora, tile and link transfer, network-level evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "torch>=2.2",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "omegaconf>=2.3",
  "trimesh>=4.0",
  "mapbox-earcut>=1.0",
  "matplotlib>=3.8",
  "rich>=13.7",
  "rasterio>=1.3",
]

[project.optional-dependencies]
scenes = ["fsspec>=2024.2", "aiohttp>=3.9", "requests>=2.31"]  # 01a: Overture download
rt = ["sionna-rt>=1.0"]                     # 01b/01c: ray tracing (GPU or CPU/LLVM)
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "I", "W", "B", "UP"]
# closures in the experiment loops are called immediately, inside the loop
lint.per-file-ignores = { "scripts/*" = ["B023"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
