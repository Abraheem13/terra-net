# Materials replicate: four cities with the main siting, every building part
# assigned one of five ITU-R P.2040 materials at random (fixed seed) instead
# of concrete for all; same geometry, so descriptors and link features are
# those of the main scenes.
dataset: sionna_mat
scenes_dir: sionna_scenes_mat
sites_scenes_dir: sionna_scenes     # same rooftop sites as the main corpus
materials: [brick, concrete, marble, metal, wood]
overture_release: "2026-09-23.0"
size_m: 3000
freq_ghz: 3.5
bs_per_city: 20
bs_height_agl: 6.0
ue_height_agl: 1.5
cell_size_m: 10.0
rt_samples: 100000000
max_depth: 5
max_pathloss_db: 150.0
rt_cities: [amsterdam, london, newyork, paris]

cities:
  amsterdam:     [52.3676, 4.9041]
  berlin:        [52.5200, 13.4050]
  hamburg:       [53.5511, 9.9937]
  munich:        [48.1351, 11.5820]
  london:        [51.5074, -0.1278]
  paris:         [48.8566, 2.3522]
  prague:        [50.0755, 14.4378]
  vienna:        [48.2082, 16.3738]
  barcelona:     [41.3851, 2.1734]
  newyork:       [40.7580, -73.9855]
  chicago:       [41.8781, -87.6298]
